[project]
name = "autocut-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.6", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.14", "redis>=5", "celery[redis]>=5.4", "httpx>=0.28", "PyJWT[crypto]>=2.10", "python-multipart>=0.0.20", "prometheus-client>=0.21", "boto3>=1.35"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14", "types-redis", "types-PyJWT"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs PostgreSQL and Redis", "media: needs FFmpeg", "mlt: needs MLT", "e2e: complete backend workflow"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
